# GC6E01 - Pokémon Colosseum
# Modified by Colosseum Recomp on 2026-10-18, see NOTICE.md.

[OnFrame]
# This game has extra memory card checks compared to most games,
# presumably to prevent Pokémon duping. These can interfere with
# saving your game when using savestates.
#
# 0x801cfc2c:
# Originally a branch that checks if the save counter in memory
# matches the one on the memory card. We patch this to instead
# overwrite the counter in memory with the one from the memory
# card. We need to do this because each memory card file actually
# contains three save slots the game rotates when saving, and
# when loading it loads the save with the biggest save counter.
# So we need to make sure the newly written save (which uses
# the value from memory + 1) is higher than any save currently
# on the card.
#
# 0x801cfc7c:
# Another branch. Not entirely sure what this one checks, but
# not patching this one sometimes still makes it recognize the
# memory card as 'not the same Memory Card as the one used to
# load the saved data', so nop it out.
#
$Allow Memory Card saving with Savestates
0x801cfc2c:dword:0x9005002c
0x801cfc7c:dword:0x60000000

# WITHDRAWN - DISABLED, kept only as documentation. Applying this measured WORSE
# than leaving the cache functions alone, and nothing was ever observed to be
# limited by them: the shipped configuration already holds speed 1.000 in the
# attract scene, gameplay and battles, so this was headroom work, not a fix.
# The samples taken with it applied were 0.50-0.75 against a clean 0.997-1.000,
# but they were contaminated (thread-suspending profiler + a human playing the
# window being measured), so the honest status is "not established either way,
# currently withdrawn". To re-test cleanly: rebuild with --opt-level default,
# measure with status.txt polling only on an unattended attract screen, and
# compare against the unpatched module (md5 8a92d1bd) in the same scene.
#
# If it is ever re-enabled, the reasoning was: data cache maintenance is
# meaningless in a recompiled build, since guest RAM *is* host memory and the
# emulated devices read it through host pointers - there is no cache to write
# back or invalidate, and Dolphin treats dcbf/dcbst/dcbi as no-ops for the same
# reason. Each function below starts with a compare, not a stwu, so it never
# opens a stack frame, meaning `blr` returns with no stack drift. DCEnable
# (0x8009B290) must stay unpatched regardless: it writes HID0, which the
# emulated CPU state does model.
$Disable data cache maintenance
0x8009B2A4:dword:0x4E800020
0x8009B2D0:dword:0x4E800020
0x8009B300:dword:0x4E800020
0x8009B330:dword:0x4E800020
0x8009B35C:dword:0x4E800020

[OnFrame_Enabled]
# Deliberately NOT listing "$Disable data cache maintenance": a patch only
# applies when its name appears here, so leaving it out keeps builds unpatched.
$Allow Memory Card saving with Savestates

